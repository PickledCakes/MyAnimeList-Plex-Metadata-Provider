name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        run: |
          pyinstaller --noconfirm --clean --onefile --name MALPlexProvider --collect-all flask --collect-all waitress app.py

      - name: Assemble release folder
        shell: pwsh
        run: |
          $out = 'release/MAL-Plex-Provider-Windows'
          New-Item -ItemType Directory -Force -Path "$out/scripts" | Out-Null
          Copy-Item dist/MALPlexProvider.exe $out/
          Copy-Item config.json,settings.json,README.md,EDIT_SETTINGS.bat,TEST_PROVIDER.bat,RUN_PROVIDER.bat,RUN_PROVIDER_BACKGROUND.cmd,INSTALL_AND_START.bat,REGISTER_STARTUP.bat,UNREGISTER_STARTUP.bat,START_PROVIDER_TASK.bat,STOP_PROVIDER_TASK.bat,VIEW_LOG.bat $out/
          Copy-Item scripts/*.ps1 "$out/scripts/"
          Compress-Archive -Path $out -DestinationPath release/MAL-Plex-Provider-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MAL-Plex-Provider-Windows
          path: release/MAL-Plex-Provider-Windows.zip

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/MAL-Plex-Provider-Windows.zip
